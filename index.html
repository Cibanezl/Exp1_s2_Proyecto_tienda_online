<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Frontend - Sumativa 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Mi Tienda</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Ropa</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Accesorios</a></li>
                </ul>
                <form id="form-busqueda" class="d-flex" role="search">
                    <input id="input-busqueda" class="form-control me-2" type="search" placeholder="Buscar producto..." aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row">
            <section class="col-lg-8">
                <h2 class="mb-4">Catálogo de Productos</h2>
                <div class="row g-4" id="contenedor-productos"></div>
            </section>

            <aside class="col-lg-4 mt-5 mt-lg-0">
                <div class="card p-3 shadow-sm">
                    <h4>Carrito de Compras</h4>
                    <ul class="list-group list-group-flush my-3" id="lista-carrito">
                        <li class="list-group-item text-muted">El carrito está vacío.</li>
                    </ul>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total:</span>
                        <span id="total-carrito">$0</span>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">© 2026 Mi Tienda Frontend - Contacto: contacto@mitienda.cl</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
